<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>電號空間分布圖系統</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css" />
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lz-string/1.4.4/lz-string.min.js"></script>

  <style>
    :root {
      --primary: #10b981;
      --primary-dark: #059669;
      --primary-light: #e8f8ee;
      --gis-teal: #00796b;
      --dark: #0f172a;
      --surface: rgba(255, 255, 255, 0.96);
      --border: #e2e8f0;
      --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
    }

    * { box-sizing: border-box; }
    body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif; background: #0f172a; overflow: hidden; }
    #map { width: 100vw; height: 100vh; background: #e5e7eb; }
    
    /* 載入畫面 */
    #loading {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(8px); z-index: 99999;
      display: none; flex-direction: column; justify-content: center; align-items: center; color: white;
    }
    .spinner {
      border: 5px solid rgba(255, 255, 255, 0.2); border-top: 5px solid var(--primary);
      border-radius: 50%; width: 50px; height: 50px;
      animation: spin 0.9s cubic-bezier(0.5, 0.1, 0.4, 0.9) infinite; margin-bottom: 16px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    #loading-text { font-size: 16px; font-weight: bold; text-align: center; line-height: 1.6; }

    /* 左上角重整按鈕 */
    .leaflet-control-reload-btn {
      background: var(--surface) !important; backdrop-filter: blur(10px);
      width: 44px !important; height: 44px !important; line-height: 44px !important;
      border-radius: 12px !important; cursor: pointer; text-align: center;
      box-shadow: var(--shadow) !important; border: 1px solid rgba(255, 255, 255, 0.8) !important;
      font-size: 20px; transition: transform 0.15s ease; user-select: none;
    }
    .leaflet-control-reload-btn:hover { transform: scale(1.06); }

    /* ★★★ 右上角：圖2專用「圖層」懸浮按鈕 ★★★ */
    .layer-control-btn {
      position: absolute; top: 14px; right: 14px; z-index: 1000;
      background: var(--surface); backdrop-filter: blur(10px);
      width: 54px; height: 54px; border-radius: 14px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.8);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.2s ease; user-select: none;
    }
    .layer-control-btn:hover { transform: scale(1.05); }
    .layer-control-btn:active { transform: scale(0.96); }
    .layer-control-btn span {
      font-size: 11px; font-weight: 800; color: var(--gis-teal); margin-top: 2px;
      letter-spacing: 0.5px;
    }

    /* ★★★ 圖層與底圖設定抽屜面板 ★★★ */
    .layer-menu-panel {
      position: absolute; top: 76px; right: 14px; z-index: 1000;
      background: var(--surface); backdrop-filter: blur(14px);
      border-radius: 18px; box-shadow: var(--shadow);
      border: 1px solid rgba(255, 255, 255, 0.9);
      width: 220px; padding: 14px; display: none; flex-direction: column;
      animation: fadeIn 0.2s ease-out;
    }
    .layer-menu-panel.active { display: flex; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }

    .layer-menu-header {
      font-size: 14px; font-weight: 800; color: var(--dark);
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 8px; border-bottom: 1px solid var(--border); margin-bottom: 10px;
    }
    .layer-close-btn {
      border: none; background: #f1f5f9; width: 22px; height: 22px;
      border-radius: 50%; font-size: 12px; font-weight: bold; cursor: pointer; color: #64748b;
    }
    .layer-section-title {
      font-size: 11.5px; font-weight: 800; color: #64748b; margin-bottom: 6px; text-transform: uppercase;
    }
    .layer-item-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 7px 0; font-size: 13.5px; font-weight: 700; color: #1e293b;
      cursor: pointer; user-select: none;
    }
    .layer-item-row input {
      width: 17px; height: 17px; accent-color: var(--primary); cursor: pointer; margin: 0;
    }
    .layer-divider {
      height: 1px; background: var(--border); border: none; margin: 8px 0;
    }

    /* 區段選擇彈窗 */
    #prefix-modal {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.65); backdrop-filter: blur(6px); z-index: 10000;
      display: flex; justify-content: center; align-items: center;
    }
    .modal-content {
      background: #ffffff; width: 92%; max-width: 440px;
      border-radius: 20px; padding: 22px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.25);
      max-height: 85vh; display: flex; flex-direction: column;
    }
    .modal-header { 
      font-size: 17px; font-weight: 800; margin-bottom: 12px; color: var(--dark);
      display: flex; justify-content: space-between; align-items: center;
    }
    .modal-tools { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; margin-bottom: 12px; }
    .prefix-search {
      width: 100%; border: 1.5px solid var(--border); border-radius: 10px;
      padding: 10px 14px; font-size: 14px; outline: none; transition: border-color 0.2s;
    }
    .prefix-search:focus { border-color: var(--primary); }
    .selection-summary {
      background: #f8fafc; border: 1px solid var(--border); border-radius: 10px;
      padding: 10px 12px; font-size: 13px; color: #475569; font-weight: 700; white-space: nowrap;
    }
    .prefix-grid {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
      overflow-y: auto; padding: 4px 2px; margin-bottom: 16px;
    }
    .prefix-label {
      background: #f8fafc; padding: 10px 6px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; font-size: 14px;
      cursor: pointer; border: 1.5px solid var(--border); font-weight: 700; color: #334155;
      transition: all 0.15s ease; user-select: none;
    }
    .prefix-label input { display: none; }
    .prefix-label.selected {
      background: var(--primary-light); border-color: var(--primary); color: var(--primary-dark);
      box-shadow: 0 2px 8px rgba(16, 185, 129, 0.25);
    }
    .prefix-label span { display: flex; flex-direction: column; align-items: center; line-height: 1.25; }
    .prefix-label small { font-size: 11px; color: #64748b; font-weight: 500; margin-top: 3px; }
    .prefix-label.selected small { color: #047857; }
    
    .modal-footer { display: flex; gap: 10px; }
    .btn { flex: 1; padding: 13px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; font-size: 15px; }
    .btn-all { background: #f1f5f9; color: #475569; }
    .btn-submit { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.3); }
    .btn-rescan { background: #f1f5f9; border: 1px solid var(--border); border-radius: 8px; padding: 5px 10px; font-size: 12px; cursor: pointer; color: #475569; font-weight: 700; }

    /* 地圖標籤樣式 */
    .zone-label {
      background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(4px);
      border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 8px;
      color: #fff; font-weight: 800; font-size: 13px; padding: 4px 8px;
      text-align: center; box-shadow: var(--shadow); white-space: nowrap;
    }
    .leaflet-popup-content-wrapper { border-radius: 16px; padding: 4px; box-shadow: var(--shadow); }
    .info-box { font-size: 14px; line-height: 1.7; min-width: 200px; padding: 8px 6px; }
    .info-header { font-size: 16px; font-weight: 800; color: #0f172a; border-bottom: 1px solid #f1f5f9; padding-bottom: 6px; margin-bottom: 6px; }
    .info-btn {
      display: block; margin-top: 10px; text-decoration: none; color: white !important;
      background: linear-gradient(135deg, #10b981 0%, #059669 100%); padding: 9px;
      text-align: center; border-radius: 10px; font-weight: 700; box-shadow: 0 3px 8px rgba(16, 185, 129, 0.35);
    }
  </style>
</head>
<body>

  <!-- ★★★ 圖2樣式：右上角獨立圖層按鈕 ★★★ -->
  <div class="layer-control-btn" onclick="toggleLayerMenu()">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#00796b" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
      <polyline points="2 17 12 22 22 17"></polyline>
      <polyline points="2 12 12 17 22 12"></polyline>
    </svg>
    <span>圖層</span>
  </div>

  <!-- ★★★ 整合底圖與圖資的彈出面板 ★★★ -->
  <div class="layer-menu-panel" id="layer-menu-panel">
    <div class="layer-menu-header">
      <span>🗂️ 圖層與底圖</span>
      <button class="layer-close-btn" onclick="toggleLayerMenu()">✕</button>
    </div>
    
    <div class="layer-section-title">🗺️ 底圖選擇</div>
    <label class="layer-item-row">
      <span>臺灣通用電子地圖</span>
      <input type="radio" name="basemap" value="EMAP" checked onchange="switchBaseMap('EMAP')">
    </label>
    <label class="layer-item-row">
      <span>正射影像 (航照圖)</span>
      <input type="radio" name="basemap" value="PHOTO" onchange="switchBaseMap('PHOTO')">
    </label>

    <hr class="layer-divider">

    <div class="layer-section-title">📌 圖資顯示</div>
    <label class="layer-item-row">
      <span>🔥 熱力圖層</span>
      <input type="checkbox" id="toggle-all-heat" checked onchange="toggleAllHeat(this.checked)">
    </label>
    <label class="layer-item-row">
      <span>📍 詳細點位</span>
      <input type="checkbox" id="toggle-all-markers" onchange="toggleAllMarkers(this.checked)">
    </label>
    <label class="layer-item-row">
      <span>🏷️ 全區中心標籤</span>
      <input type="checkbox" id="toggle-all-labels" onchange="toggleGodModeLabels(this.checked)">
    </label>
  </div>

  <!-- 區段選擇彈窗 -->
  <div id="prefix-modal">
    <div class="modal-content">
      <div class="modal-header">
        <span>⚡ 選擇載入電號區段</span>
        <button class="btn-rescan" onclick="forceRescan()">🔄 重新掃描</button>
      </div>
      <div class="modal-tools">
        <input class="prefix-search" id="prefix-search" type="search" placeholder="搜尋區段代碼，如 1001" oninput="filterPrefixes()">
        <div class="selection-summary" id="selection-summary">已選 0 區 / 約 0 筆</div>
      </div>
      <div class="prefix-grid" id="prefix-container"></div>
      <div class="modal-footer">
        <button class="btn btn-all" onclick="toggleAllPrefixes()">全選 / 清除</button>
        <button class="btn btn-submit" onclick="startLoadingData()">🚀 載入資料</button>
      </div>
    </div>
  </div>

  <div id="loading">
    <div class="spinner"></div>
    <div id="loading-text">系統啟動中...</div>
  </div>

  <div id="map"></div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <script>
    const DB_CONFIGS = [
      {
        name: "新主機 (主力)",
        url: "https://gdpcyoogacdkwuozmbbw.supabase.co",
        key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdkcGN5b29nYWNka3d1b3ptYmJ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzQ0Mjg1NDIsImV4cCI6MjA5MDAwNDU0Mn0.iEHYVwY3I0wFwjsAC1qyNx2-DlRscwbanLqZCmzc4po"
      },
      {
        name: "舊主機 (備援)",
        url: "https://tyknsyxarxmswptjpypw.supabase.co", 
        key: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5a25zeXhhcnhtc3dwdGpweXB3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI3MDcyMzIsImV4cCI6MjA4ODI4MzIzMn0.4GgiN0VZFdGBLEAXl0qamdIAIatQx29zcwVwnqeQudE" 
      }
    ];

    const EDGE_AUTH_URL = "https://gdpcyoogacdkwuozmbbw.supabase.co/functions/v1/hyper-responder";
    const COLOR_PALETTE = ['#e11d48', '#2563eb', '#16a34a', '#9333ea', '#ea580c', '#0891b2', '#db2777', '#ca8a04', '#4f46e5', '#059669'];
    let CONFIG = { 'OTHER': { color: 'gray', hex: '#64748b', gradient: {0.4: '#64748b', 1: '#0f172a'} } };

    let map;
    let baseLayers = {};
    let layersRef = { heat: {}, markers: {} };
    let colorIndex = 0; 
    let isAllSelected = false;
    let prefixRows = [];
    let currentAccessToken = null; 
    let godModeLayer = null;   

    async function fetchWithFailover(apiPath, method = 'GET', bodyData = null) {
      let lastError;
      for (let i = 0; i < DB_CONFIGS.length; i++) {
        let db = DB_CONFIGS[i];
        try {
          let bearerToken = currentAccessToken ? currentAccessToken : db.key;
          let options = {
            method: method,
            headers: { 
              "apikey": db.key, 
              "Authorization": "Bearer " + bearerToken,
              "Content-Type": "application/json"
            }
          };
          if (bodyData) options.body = JSON.stringify(bodyData);

          let response = await fetch(db.url + apiPath, options);
          if (response.ok) {
            return await response.json(); 
          } else {
            lastError = new Error(`[${db.name}] 狀態異常: ${response.status}`);
          }
        } catch (err) {
          lastError = err;
        }
      }
      throw new Error("❌ 主機連線異常"); 
    }

    // ==========================================
    // ★ 系統安全鎖 (修復 LINE 內卡死問題)
    // ==========================================
    async function initSecurityCheck() {
      try { 
        // 1. 初始化 LIFF (加上 3 秒防逾時保證，防止 LINE App 內部無限卡住)
        if (window.liff && typeof liff.init === 'function') {
          await Promise.race([
            liff.init({ liffId: "2009264862-z2kqi1C3" }),
            new Promise((_, reject) => setTimeout(() => reject(new Error("LIFF Init Timeout")), 3000))
          ]).catch(e => console.warn("LIFF 初始化跳過:", e));
        }

        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.ready();
        }

        const cachedToken = sessionStorage.getItem('session_access_token');
        if (cachedToken) {
          currentAccessToken = cachedToken;
          document.getElementById('loading').style.display = 'none';
          return true; 
        }

        let requestPayload = {};
        const urlParams = new URLSearchParams(window.location.search);
        const otpFromUrl = urlParams.get('otp') || urlParams.get('token');

        if (otpFromUrl) {
          window.history.replaceState(null, null, window.location.pathname);
          requestPayload = { otp: otpFromUrl.trim() };
        } else if (window.liff && liff.isInClient()) {
          document.getElementById('loading').style.display = 'flex';
          document.getElementById('loading-text').innerHTML = "⚡ LINE 身分安全核驗中...";
          requestPayload = { is_line_client: true };
        } else if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initData) {
          document.getElementById('loading').style.display = 'flex';
          document.getElementById('loading-text').innerHTML = "⚡ Telegram 身分安全核驗中...";
          requestPayload = { is_line_client: true };
        } else {
          let inputOtp = prompt("🔐 存取受保護的資料庫\n\n請輸入 LINE 或 Telegram 派發的 6 位數電腦登入碼：\n（請至聊天室傳送「電腦登入」獲取）");
          if (!inputOtp) return blockAccess("未輸入驗證碼");
          requestPayload = { otp: inputOtp.trim() };
        }

        const controller = new AbortController();
        const timeoutId = setTimeout(() => controller.abort(), 8000);

        const response = await fetch(EDGE_AUTH_URL, {
          method: "POST",
          headers: { "apikey": DB_CONFIGS[0].key, "Content-Type": "application/json" },
          body: JSON.stringify(requestPayload),
          signal: controller.signal
        });
        clearTimeout(timeoutId);

        const result = await response.json();

        if (response.ok && result.access_token) {
          currentAccessToken = result.access_token;
          sessionStorage.setItem('session_access_token', currentAccessToken);
          
          // ★★★ 核心必修：核驗通過後，立刻關閉 Loading 遮罩，露出選區彈窗 ★★★
          document.getElementById('loading').style.display = 'none';
          return true; 
        } else {
          sessionStorage.removeItem('session_access_token');
          document.getElementById('loading').style.display = 'none';
          alert("❌ 驗證未通過：\n" + (result.error || "未知錯誤"));
          return blockAccess(result.error);
        }
      } catch (err) { 
        sessionStorage.removeItem('session_access_token');
        document.getElementById('loading').style.display = 'none';
        alert("❌ 身分核驗異常：" + (err.name === 'AbortError' ? '連線逾時' : err.message));
        return blockAccess("系統連線異常");
      }
    }

    function blockAccess(reason) {
      document.body.innerHTML = `
        <div style="display:flex; height:100vh; width:100vw; background:#0f172a; color:white; justify-content:center; align-items:center; flex-direction:column; text-align:center; padding:20px;">
          <h1 style="color:#ef4444; margin-bottom:8px;">⛔ 存取被拒</h1>
          <p style="color:#94a3b8; font-size:15px; max-width:380px; line-height:1.6;">
            ${reason || "請從官方 LINE / Telegram 開啟，或輸入正確的 6 位數電腦登入碼。"}
          </p>
          <button onclick="location.reload()" style="margin-top:20px; padding:12px 28px; background:#10b981; color:white; border:none; border-radius:10px; font-weight:bold; font-size:15px; cursor:pointer;">
            🔄 重新整理
          </button>
        </div>
      `;
      return false;
    }

    window.onload = async function() { 
      const isAllowed = await initSecurityCheck(); 
      if (isAllowed === true) {
        initMap(); 
      }
    };

    // ==========================================
    // 地圖初始化
    // ==========================================
    function initMap() {
      const emapLayer = L.tileLayer('https://wmts.nlsc.gov.tw/wmts/EMAP/default/GoogleMapsCompatible/{z}/{y}/{x}', {
        attribution: '&copy; <a href="https://maps.nlsc.gov.tw/" target="_blank">國土測繪圖資服務雲</a>',
        maxNativeZoom: 20,
        maxZoom: 20
      });

      const photoLayer = L.tileLayer('https://wmts.nlsc.gov.tw/wmts/PHOTO2/default/GoogleMapsCompatible/{z}/{y}/{x}', {
        attribution: '&copy; <a href="https://maps.nlsc.gov.tw/" target="_blank">國土測繪圖資服務雲</a>',
        maxNativeZoom: 19,
        maxZoom: 20
      });

      baseLayers = { "EMAP": emapLayer, "PHOTO": photoLayer };

      map = L.map('map', { 
        center: [23.05, 120.2], 
        zoom: 12, 
        layers: [emapLayer], 
        preferCanvas: true, 
        zoomControl: false 
      });

      L.control.zoom({ position: 'bottomright' }).addTo(map);

      // 左上角浮動按鈕：重新選擇區段 (使用原始重整圖示 🔄)
      const ReloadControl = L.Control.extend({
        options: { position: 'topleft' },
        onAdd: function() {
          const div = L.DomUtil.create('div', 'leaflet-control-reload-btn');
          div.innerHTML = '🔄';
          div.title = "重新選擇區段";
          div.onclick = function() { 
            localStorage.removeItem('last_selected_prefixes'); 
            location.reload(); 
          }; 
          return div;
        }
      });
      map.addControl(new ReloadControl());

      buildPrefixModal();
    }

    // ★★★ 圖層選單開啟 / 關閉切換 ★★★
    function toggleLayerMenu() {
      const panel = document.getElementById('layer-menu-panel');
      panel.classList.toggle('active');
    }

    // 底圖切換
    function switchBaseMap(type) {
      if (type === 'EMAP') {
        map.removeLayer(baseLayers["PHOTO"]);
        map.addLayer(baseLayers["EMAP"]);
      } else {
        map.removeLayer(baseLayers["EMAP"]);
        map.addLayer(baseLayers["PHOTO"]);
      }
    }

    // 圖資圖層切換
    function toggleAllHeat(checked) {
      for (let key in layersRef.heat) {
        checked ? map.addLayer(layersRef.heat[key]) : map.removeLayer(layersRef.heat[key]);
      }
    }

    function toggleAllMarkers(checked) {
      for (let key in layersRef.markers) {
        checked ? map.addLayer(layersRef.markers[key]) : map.removeLayer(layersRef.markers[key]);
      }
    }

    async function toggleGodModeLabels(checked) {
      if (!checked) {
        if (godModeLayer) map.removeLayer(godModeLayer);
        return;
      }

      if (godModeLayer) {
        map.addLayer(godModeLayer);
        return;
      }

      document.getElementById('loading').style.display = 'flex';
      document.getElementById('loading-text').innerHTML = "🏷️ 載入全區標籤中...";

      try {
        godModeLayer = L.layerGroup();
        const data = await fetchWithFailover("/rest/v1/power_prefix_centers?select=*", "GET");
        let bounds = [];

        data.forEach(row => {
          let marker = L.marker([row.center_lat, row.center_lng], {
            icon: L.divIcon({
              className: 'zone-label',
              html: `
                <span style="color:#10b981;font-weight:900;font-size:15px;">${row.prefix}</span><br>
                <span style="font-size:11px;color:#cbd5e1;">(${row.total_points} 筆)</span>
              `,
              iconSize: [68, 44],
              iconAnchor: [34, 22]
            })
          });

          godModeLayer.addLayer(marker);
          bounds.push([row.center_lat, row.center_lng]);
        });

        godModeLayer.addTo(map);
        document.getElementById('loading').style.display = 'none';

        if (bounds.length > 0) {
          map.fitBounds(bounds, { padding: [50, 50] });
        }
      } catch (err) {
        document.getElementById('loading').style.display = 'none';
        alert("載入標籤失敗，請檢查網路。");
        document.getElementById('toggle-all-labels').checked = false;
      }
    }

    // ==========================================
    // 區段彈窗渲染
    // ==========================================
    async function buildPrefixModal() {
      const container = document.getElementById('prefix-container');
      const cachedPrefixes = localStorage.getItem('power_prefixes_cache');
      
      if (cachedPrefixes) {
        try {
          const cached = JSON.parse(cachedPrefixes);
          if (cached && cached.rows) {
            prefixRows = cached.rows;
            renderPrefixes(prefixRows);
            return;
          }
        } catch (e) {
          localStorage.removeItem('power_prefixes_cache');
        }
      }

      container.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: var(--primary); padding: 25px; font-weight:bold;">🔄 正在讀取資料庫分區...</div>';

      try {
        const data = await fetchWithFailover("/rest/v1/power_prefix_centers?select=prefix,total_points&order=prefix.asc", "GET");
        prefixRows = data
          .filter(item => item.prefix)
          .map(item => ({ prefix: item.prefix, total_points: Number(item.total_points || 0) }));
        localStorage.setItem('power_prefixes_cache', JSON.stringify({ savedAt: Date.now(), rows: prefixRows }));
        renderPrefixes(prefixRows);
      } catch (err) {
        container.innerHTML = '<div style="grid-column: 1 / -1; text-align: center; color: #ef4444; padding: 20px;">❌ 讀取清單失敗，請檢查連線。</div>';
      }
    }

    function renderPrefixes(rows) {
      const container = document.getElementById('prefix-container');
      container.innerHTML = ''; 
      
      let lastSelected = [];
      try {
        const saved = localStorage.getItem('last_selected_prefixes');
        if (saved) lastSelected = JSON.parse(saved);
      } catch (e) {}

      rows.forEach(row => {
        const prefix = row.prefix;
        const isChecked = lastSelected.includes(prefix);

        const label = document.createElement('label');
        label.className = 'prefix-label' + (isChecked ? ' selected' : '');
        label.dataset.prefix = prefix;
        label.dataset.points = row.total_points || 0;

        label.innerHTML = `
          <input type="checkbox" value="${prefix}" ${isChecked ? 'checked' : ''} onchange="handlePrefixChange(this)">
          <span>${prefix}<small>${formatCompactNumber(row.total_points || 0)} 筆</small></span>
        `;
        
        container.appendChild(label);
      });
      updateSelectionSummary();

      if (lastSelected.length > 0) {
        startLoadingData();
      }
    }

    function handlePrefixChange(checkbox) {
      const parentLabel = checkbox.closest('.prefix-label');
      if (checkbox.checked) {
        parentLabel.classList.add('selected');
      } else {
        parentLabel.classList.remove('selected');
      }
      updateSelectionSummary();
    }

    function formatCompactNumber(n) {
      n = Number(n || 0);
      if (n >= 10000) return (n / 10000).toFixed(1).replace(".0", "") + "萬";
      return n.toLocaleString("zh-TW");
    }

    function filterPrefixes() {
      const keyword = document.getElementById('prefix-search').value.trim();
      document.querySelectorAll('.prefix-label').forEach(label => {
        label.style.display = !keyword || label.dataset.prefix.indexOf(keyword) > -1 ? "flex" : "none";
      });
    }

    function updateSelectionSummary() {
      let selectedCount = 0;
      let selectedPoints = 0;
      document.querySelectorAll('#prefix-container input[type="checkbox"]').forEach(cb => {
        const label = cb.closest('.prefix-label');
        const points = Number(label.dataset.points || 0);
        if (cb.checked) {
          selectedCount++;
          selectedPoints += points;
        }
      });
      document.getElementById('selection-summary').textContent = `已選 ${selectedCount} 區 / 約 ${formatCompactNumber(selectedPoints)} 筆`;
      return { selectedCount, selectedPoints };
    }

    async function forceRescan() {
      if(confirm("確定要重新掃描最新區段統計嗎？")) {
        localStorage.removeItem('power_prefixes_cache'); 
        document.getElementById('prefix-container').innerHTML = ''; 
        await buildPrefixModal(); 
      }
    }

    function toggleAllPrefixes() {
      isAllSelected = !isAllSelected;
      const checkboxes = document.querySelectorAll('#prefix-container .prefix-label:not([style*="display: none"]) input[type="checkbox"]');
      checkboxes.forEach(cb => {
        cb.checked = isAllSelected;
        cb.closest('.prefix-label').classList.toggle('selected', isAllSelected);
      });
      updateSelectionSummary();
    }

    // ==========================================
    // 資料批次加載
    // ==========================================
    async function startLoadingData() {
      const checkboxes = document.querySelectorAll('#prefix-container input[type="checkbox"]:checked');
      const selectedPrefixes = Array.from(checkboxes).map(cb => cb.value);

      if (selectedPrefixes.length === 0) {
        alert("請至少選擇一個區段！");
        return;
      }

      const summary = updateSelectionSummary();
      if (summary.selectedPoints > 30000 || selectedPrefixes.length > 8) {
        const ok = confirm(`本次載入約 ${formatCompactNumber(summary.selectedPoints)} 筆點位，可能需要數秒時間。\n\n確定繼續載入？`);
        if (!ok) return;
      }

      localStorage.setItem('last_selected_prefixes', JSON.stringify(selectedPrefixes));
      document.getElementById('prefix-modal').style.display = 'none';
      document.getElementById('loading').style.display = 'flex';

      try {
        let allData = [];
        const limit = 10000;

        for (let i = 0; i < selectedPrefixes.length; i++) {
          let prefix = selectedPrefixes[i];
          let offset = 0;
          let hasMore = true;

          while (hasMore) {
            document.getElementById('loading-text').innerHTML = `🌐 下載區段 [${prefix}] 中...<br>(累計 ${allData.length.toLocaleString()} 筆)`;
            const apiPath = `/rest/v1/power_data?power_no=like.${prefix}*&select=power_no,civil_eng,lat,lng&limit=${limit}&offset=${offset}&order=power_no.asc`;
            const json = await fetchWithFailover(apiPath, "GET");
            allData = allData.concat(json);
            
            if (json.length < limit) {
              hasMore = false; 
            } else {
              offset += limit; 
            }
          }
        }

        document.getElementById('loading-text').innerHTML = "🎨 圖資下載完成，正在渲染點位...";
        const mappedData = allData.map(r => [r.lat, r.lng, r.power_no || "", r.civil_eng || ""]);
        processData(mappedData);

      } catch (err) {
        console.error(err);
        document.getElementById('loading-text').innerHTML = "載入失敗，請檢查網路狀態";
      }
    }

    function processData(data) {
      for (let key in layersRef.heat) map.removeLayer(layersRef.heat[key]);
      for (let key in layersRef.markers) map.removeLayer(layersRef.markers[key]);

      layersRef = { heat: {}, markers: {} };
      let groups = { 'OTHER': { p: [], m: [] } }; 
      let allBounds = [];

      for (let i = 0; i < data.length; i++) {
        let lat = Number(data[i][0]), lng = Number(data[i][1]);
        let elecNo = String(data[i][2]).trim(), name = String(data[i][3]);
        if (!lat || !lng) continue;

        let prefix = 'OTHER';
        let match = elecNo.match(/^(\d{4})/);
        if (match) prefix = match[1];
        
        if (!groups[prefix]) {
          groups[prefix] = { p: [], m: [] };
          if (!CONFIG[prefix]) {
            let hex = COLOR_PALETTE[colorIndex % COLOR_PALETTE.length];
            CONFIG[prefix] = { hex: hex, gradient: { 0.4: hex, 1: hex } };
            colorIndex++;
          }
        }
        groups[prefix].p.push([lat, lng]);
        
        let circle = L.circleMarker([lat, lng], { 
          radius: 6, 
          fillColor: CONFIG[prefix].hex, 
          color: "#ffffff", 
          weight: 1.5, 
          fillOpacity: 0.85 
        });
        circle.dataProps = { no: elecNo, name: name, lat: lat, lng: lng }; 
        circle.on('click', function(e) {
          let p = e.target.dataProps;
          let url = "https://www.google.com/maps/search/?api=1&query=" + p.lat + "," + p.lng;
          let popupContent = `
            <div class="info-box">
              <div class="info-header">⚡ 電號：${p.no || '無'}</div>
              <div>🏗️ <b>設備名稱：</b>${p.name || '無'}</div>
              <div>📍 <b>坐標：</b>${p.lat.toFixed(5)}, ${p.lng.toFixed(5)}</div>
              <a href="${url}" target="_blank" class="info-btn">🚗 Google 導航</a>
            </div>
          `;
          e.target.bindPopup(popupContent).openPopup();
        });
        
        groups[prefix].m.push(circle);
        allBounds.push([lat, lng]); 
      }

      Object.keys(groups).sort().forEach(key => {
        if (groups[key].p.length === 0) return;

        let cfg = CONFIG[key];
        let heat = L.heatLayer(groups[key].p, { radius: 24, blur: 18, maxZoom: 15, minOpacity: 0.45, gradient: cfg.gradient });

        let center = getCenter(groups[key].p);
        let lbl = null;
        if (center) {
          lbl = L.marker(center, { 
            icon: L.divIcon({ className: 'zone-label', html: key, iconSize: [46, 24] }), 
            interactive: false 
          });
        }

        let heatGroup = lbl ? L.layerGroup([heat, lbl]) : L.layerGroup([heat]);
        layersRef.heat[key] = heatGroup;

        if (key !== 'OTHER') {
          map.addLayer(heatGroup);
        }

        let cluster = L.markerClusterGroup({ 
          disableClusteringAtZoom: 18, 
          spiderfyOnMaxZoom: false, 
          maxClusterRadius: 70, 
          chunkedLoading: true 
        });
        cluster.addLayers(groups[key].m);
        layersRef.markers[key] = cluster;
      });

      document.getElementById('loading').style.display = 'none';

      if (allBounds.length > 0) {
        map.fitBounds(allBounds, { padding: [40, 40] });
      }
    }

    function getCenter(p) { 
      if(p.length === 0) return null; 
      let la = 0, lo = 0; 
      for(let i = 0; i < p.length; i++) { la += p[i][0]; lo += p[i][1]; } 
      return [la / p.length, lo / p.length]; 
    }
  </script>
